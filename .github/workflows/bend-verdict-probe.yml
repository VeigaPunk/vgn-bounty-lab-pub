name: bend-verdict-probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bend-verdict-probe.yml'
      - 'attacks/**'
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install bend 2.0.32 (sha256-pinned)
        run: |
          curl -sL https://github.com/bendlang/bend/releases/download/v2.0.32/bend-2.0.32-linux-x64.tar.gz -o bend.tar.gz
          echo "5c365ddb12954d0933cef751802e0f7d9875f842edcb80f9661f89cd1a9ff7b6  bend.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.bend"
          tar -xzf bend.tar.gz -C "$HOME/.bend"
          BENDBIN=$(find "$HOME/.bend" -type f -name bend | head -1)
          test -n "$BENDBIN"
          chmod +x "$BENDBIN"
          echo "$(dirname "$BENDBIN")" >> "$GITHUB_PATH"

      - name: toolchain check
        run: |
          bend --version
          bend --help 2>&1 | head -40 || true

      - name: smoke — verdict over upstream examples (tag v2.0.32)
        run: |
          git clone --depth 1 --branch v2.0.32 https://github.com/bendlang/bend.git /tmp/bend-src
          find /tmp/bend-src -name '*.bend' -not -path '*/target/*' | head -10 > files.txt
          echo "=== files under verdict:"
          cat files.txt
          PASS=0; FAIL=0
          while read -r f; do
            echo "=== $f"
            if timeout 60 bend "$f" --verdict; then PASS=$((PASS+1)); else FAIL=$((FAIL+1)); echo "VERDICT-NONZERO: $f"; fi
          done < files.txt
          echo "SMOKE SUMMARY: pass=$PASS fail=$FAIL"

      - name: attacks — all repo attack files (surprise = signal)
        run: |
          shopt -s nullglob
          for f in attacks/*.bend; do
            echo "=== ATTACK: $f"
            if timeout 120 bend "$f" --verdict; then
              echo "ALL-CHECK-PASS: $f"
              echo "$f" >> surprise.txt
            else
              echo "REJECTED: $f"
            fi
          done
          if [ -f surprise.txt ]; then
            echo "!!! SURPRISE: files passed --verdict:"
            cat surprise.txt
            exit 1  # surface loudly in the run status
          fi
          echo "no surprises: all attack files correctly rejected"

      - name: upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bend-probe-log
          path: files.txt
          if-no-files-found: ignore
