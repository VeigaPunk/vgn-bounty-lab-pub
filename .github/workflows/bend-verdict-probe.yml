name: bend-verdict-probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bend-verdict-probe.yml'
      - 'attacks/**'
permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install bend 2.0.32 (sha256-pinned)
        run: |
          curl -sL https://github.com/bendlang/bend/releases/download/v2.0.32/bend-2.0.32-linux-x64.tar.gz -o bend.tar.gz
          echo "5c365ddb12954d0933cef751802e0f7d9875f842edcb80f9661f89cd1a9ff7b6  bend.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.bend"
          tar -xzf bend.tar.gz -C "$HOME/.bend"
          echo "=== all bend-named files (binary = the >10MB one):"
          find "$HOME/.bend" -type f -name 'bend*' -exec ls -la {} \; > extraction-tree.txt
          find "$HOME/.bend" -type f -name 'bend*' ! -size +10M -exec sh -c 'echo "--- $1 (head)"; head -c 2000 "$1"' _ {} \; > text-bend-files.txt || true

      - name: resolve binary per-step (no cross-step path threading)
        id: bendbin
        run: |
          BENDBIN=$(find "$HOME/.bend" -type f -name bend -size +10M | head -1)
          test -n "$BENDBIN"
          echo "bin=$BENDBIN" >> "$GITHUB_OUTPUT"
          "$BENDBIN" --version

      - name: toolchain diagnostics (evidence)
        run: |
          {
            echo "=== extraction tree:"
            cat extraction-tree.txt
            echo "=== real binary: ${{ steps.bendbin.outputs.bin }}"
            file "${{ steps.bendbin.outputs.bin }}" || true
            echo "=== help head:"
            "${{ steps.bendbin.outputs.bin }}" --help 2>&1 | head -40 || true
            echo "=== text bend* files bundled in tarball (leads):"
            cat text-bend-files.txt 2>/dev/null || true
          } > toolchain.log 2>&1 || true
          cat toolchain.log

      - name: smoke — verdict over upstream examples (tag v2.0.32)
        run: |
          {
            git clone --depth 1 --branch v2.0.32 https://github.com/bendlang/bend.git /tmp/bend-src
            find /tmp/bend-src -name '*.bend' -not -path '*/target/*' | head -10 > files.txt || true
            echo "=== files under verdict:"; cat files.txt
            PASS=0; FAIL=0
            while read -r f; do
              echo "=== $f"
              timeout 60 "${{ steps.bendbin.outputs.bin }}" "$f" --verdict && PASS=$((PASS+1)) || { FAIL=$((FAIL+1)); echo "VERDICT-NONZERO: $f"; }
            done < files.txt
            echo "SMOKE SUMMARY: pass=$PASS fail=$FAIL"
          } > smoke.log 2>&1 || true
          cat smoke.log

      - name: attacks — all repo attack files (surprise = signal)
        run: |
          {
            shopt -s nullglob
            for f in attacks/*.bend; do
              echo "=== ATTACK: $f"
              if timeout 120 "${{ steps.bendbin.outputs.bin }}" "$f" --verdict; then
                echo "ALL-CHECK-PASS: $f  <<< SURPRISE"
              else
                echo "REJECTED: $f"
              fi
            done
          } > attacks.log 2>&1 || true
          cat attacks.log

      - name: commit probe evidence (anonymous-readable)
        run: |
          mkdir -p probe-results
          {
            echo "# bend-verdict-probe $(date -u +%Y-%m-%dT%H:%M:%SZ) @ ${GITHUB_SHA::7}"
            echo; echo "## toolchain"; cat toolchain.log 2>/dev/null
            echo; echo "## smoke"; cat smoke.log 2>/dev/null
            echo; echo "## attacks"; cat attacks.log 2>/dev/null
          } > probe-results/latest.log
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add probe-results/latest.log
          git commit -m "probe results @ ${GITHUB_SHA::7}" || echo "no changes"
          git push || echo "push failed (non-fatal)"
